<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Oximeter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }

    #hr-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    #hr-value {
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      color: #f43f5e;
      font-variant-numeric: tabular-nums;
      transition: transform 0.1s ease;
    }

    #hr-value.beat {
      transform: scale(1.08);
    }

    #hr-unit {
      font-size: 1.1rem;
      color: #64748b;
      letter-spacing: 0.1em;
    }

    #raw-display {
      font-family: monospace;
      font-size: 0.85rem;
      color: #475569;
      background: #1e293b;
      border-radius: 0.4rem;
      padding: 0.4rem 0.8rem;
      letter-spacing: 0.05em;
    }

    #status {
      font-size: 0.9rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: #1e293b;
      color: #64748b;
    }

    #status.connected { color: #4ade80; }
    #status.error     { color: #f87171; }

    #connect-btn {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      background: #f43f5e;
      color: #fff;
      transition: background 0.2s, opacity 0.2s;
    }

    #connect-btn:hover:not(:disabled) { background: #e11d48; }
    #connect-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #disconnect-btn {
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      border: 1px solid #334155;
      border-radius: 0.4rem;
      cursor: pointer;
      background: transparent;
      color: #94a3b8;
      display: none;
    }

    #disconnect-btn:hover { border-color: #f43f5e; color: #f43f5e; }

    #log {
      width: min(480px, 90vw);
      max-height: 160px;
      overflow-y: auto;
      font-size: 0.78rem;
      font-family: monospace;
      color: #475569;
      background: #1e293b;
      border-radius: 0.5rem;
      padding: 0.75rem;
      line-height: 1.6;
    }

    #log p { margin: 0; }
    #log p.warn  { color: #fbbf24; }
    #log p.error { color: #f87171; }
  </style>
</head>
<body>

  <h1>❤ Pulse Oximeter</h1>
  <span style="font-size:0.75rem;color:#334155;letter-spacing:0.05em;">v1.6.0</span>

  <div id="hr-display">
    <span id="hr-value">--</span>
    <span id="hr-unit">Oxygen</span>
  </div>

  <div id="raw-display">raw: —</div>

  <div id="status">Disconnected</div>

  <div style="display:flex;gap:0.75rem;align-items:center">
    <button id="connect-btn">Connect Device</button>
    <button id="disconnect-btn">Disconnect</button>
  </div>

  <div id="log"></div>

<script>
  // Custom BLE UUIDs for this device (0xFFE0 service family)
  const CUSTOM_SERVICE        = '0000ffe0-0000-1000-8000-00805f9b34fb';
  const CUSTOM_CHARACTERISTIC = '0000ffe4-0000-1000-8000-00805f9b34fb';

  const connectBtn    = document.getElementById('connect-btn');
  const disconnectBtn = document.getElementById('disconnect-btn');
  const hrValue       = document.getElementById('hr-value');
  const rawDisplay    = document.getElementById('raw-display');
  const statusEl      = document.getElementById('status');
  const logEl         = document.getElementById('log');

  let device = null;
  let characteristic = null;

  // ── Logging ────────────────────────────────────────────────────────────────

  function log(msg, level = 'info') {
    const p = document.createElement('p');
    p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    if (level !== 'info') p.className = level;
    logEl.prepend(p);
  }

  // ── Data Parsing ───────────────────────────────────────────────────────────
  // Packet format for this device (0xFFE4 characteristic):
  //   Byte 0: header (0xFE)
  //   Byte 1: packet length
  //   Remaining bytes: payload (protocol TBD — displayed raw for now)

  function toHex(dataView) {
    const bytes = [];
    for (let i = 0; i < dataView.byteLength; i++) {
      bytes.push(dataView.getUint8(i).toString(16).padStart(2, '0'));
    }
    return bytes.join(' ');
  }

  function onNotification(event) {
    const dv = event.target.value;
    const hex = toHex(dv);
    rawDisplay.textContent = `raw: ${hex}`;

    // Only process packets where byte 2 (3rd byte) == 0x55
    if (dv.byteLength < 3 || dv.getUint8(2) !== 0x55) {
      log(`Packet ignored (byte[2] != 0x55): ${hex}`);
      return;
    }

    log(`Packet: ${hex}`);

    // Byte index 5 (6th byte) = oxygen value
    if (dv.byteLength > 5) {
      const oxygen = dv.getUint8(5);
      hrValue.textContent = oxygen;
      hrValue.classList.remove('beat');
      void hrValue.offsetWidth;
      hrValue.classList.add('beat');
    }
  }

  // ── UI helpers ─────────────────────────────────────────────────────────────

  function setStatus(text, cls = '') {
    statusEl.textContent = text;
    statusEl.className = cls;
  }

  // ── Connect ────────────────────────────────────────────────────────────────

  connectBtn.addEventListener('click', async () => {
    if (!navigator.bluetooth) {
      log('Web Bluetooth API not available. Use Chrome on a supported OS.', 'error');
      return;
    }

    try {
      connectBtn.disabled = true;
      setStatus('Scanning…');
      log('Requesting BLE device…');

      // On subsequent visits, reconnect directly without the picker
      const known  = navigator.bluetooth.getDevices
        ? await navigator.bluetooth.getDevices()
        : [];
      log(`Known devices: ${known.length} (${known.map(d => d.name ?? d.id).join(', ') || 'none'})`);
      const lastId = localStorage.getItem('lastDeviceId');
      log(`Last device ID: ${lastId ?? 'none'}`);
      const preferred = known.find(d => d.id === lastId) ?? known[0];

      if (preferred) {
        log(`Reconnecting to ${preferred.name ?? preferred.id}…`);
        try {
          device = preferred;
          device.addEventListener('gattserverdisconnected', onDisconnected);
          setStatus('Connecting…');
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(CUSTOM_SERVICE);
          characteristic = await service.getCharacteristic(CUSTOM_CHARACTERISTIC);
          characteristic.addEventListener('characteristicvaluechanged', onNotification);
          await characteristic.startNotifications();
          localStorage.setItem('lastDeviceId', device.id);
          log('Notifications started');
          setStatus(`Connected — ${device.name ?? device.id}`, 'connected');
          disconnectBtn.style.display = 'inline-block';
          connectBtn.disabled = false;
          return;
        } catch (err) {
          log(`Auto-connect failed: ${err.message} — opening picker…`, 'warn');
          localStorage.removeItem('lastDeviceId');
          device = null;
        }
      }

      // Filter by advertised UUID (0xFFF0) — device doesn't advertise 0xFFE0 until connected
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: ['0000fff0-0000-1000-8000-00805f9b34fb'] }],
        optionalServices: [CUSTOM_SERVICE],
      });

      log(`Device selected: ${device.name ?? '(unnamed)'}`);
      localStorage.setItem('lastDeviceId', device.id);
      device.addEventListener('gattserverdisconnected', onDisconnected);

      setStatus('Connecting…');
      const server  = await device.gatt.connect();
      log('GATT server connected');

      const service = await server.getPrimaryService(CUSTOM_SERVICE);
      characteristic = await service.getCharacteristic(CUSTOM_CHARACTERISTIC);

      characteristic.addEventListener('characteristicvaluechanged', onNotification);
      await characteristic.startNotifications();

      log('Notifications started');
      setStatus(`Connected — ${device.name ?? device.id}`, 'connected');
      disconnectBtn.style.display = 'inline-block';

    } catch (err) {
      log(`Error: ${err.message}`, 'error');
      setStatus('Error', 'error');
      connectBtn.disabled = false;
    }
  });

  // ── Disconnect ─────────────────────────────────────────────────────────────

  disconnectBtn.addEventListener('click', () => {
    if (device?.gatt.connected) {
      device.gatt.disconnect();
    }
  });

  function onDisconnected() {
    log('Device disconnected');
    setStatus('Disconnected');
    hrValue.textContent = '--';
    rawDisplay.textContent = 'raw: —';
    connectBtn.disabled = false;
    disconnectBtn.style.display = 'none';
    characteristic = null;
    device = null;
  }
</script>
</body>
</html>
